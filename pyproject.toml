[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "slayer"
version = "1.0.0"
description = "SLAYER - HTTP Load Testing Tool"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
]

[project.optional-dependencies]
async = ["aiohttp>=3.9.0"]

[project.scripts]
slayer = "slayer:main"

[tool.setuptools]
py-modules = ["slayer"]
